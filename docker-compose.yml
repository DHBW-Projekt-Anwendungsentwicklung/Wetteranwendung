services:
   web:
     image: ghcr.io/dhbw-projekt-anwendungsentwicklung/wetteranwendung:latest
     container_name: wetteranwendung
     ports:
       - "127.0.0.1:8000:8000"
     env_file:
       - .env
     volumes:
       - .:/app
     restart: always
     deploy:
       resources:
         limits:
           cpus: "2.0"
           memory: "1GB"

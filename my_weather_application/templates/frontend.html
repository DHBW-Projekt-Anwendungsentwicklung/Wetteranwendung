<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktive Weltkarte</title>
    {% load static %}
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css">
    <!-- Dein eigenes CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div id="map"></div>
    <div id="sidebar">
        <div class="field">
            <label for="latitude">Breitengrad:</label>
            <input type="text" id="latitude" placeholder="z.B. 51.5074">
        </div>
        <div class="field">
            <label for="longitude">Längengrad:</label>
            <input type="text" id="longitude" placeholder="z.B. -0.1278">
        </div>
        <div class="field">
            <label for="radius">Radius: <span id="radiusValue">100</span> km</label>
            <input type="range" id="radius" min="1" max="100" step="1" value="100" oninput="updateRadiusValue()">
            <div class="slider-labels">
                <span>1</span>
                <span>100</span>
            </div>
        </div>

        <div class="field">
            <label>Zeitraum:</label>
            <div class="year-container">
                <input type="number" id="yearFrom" min="1800" max="2025">
                <span>bis</span>
                <input type="number" id="yearTo" min="1800" max="2025">
            </div>
        </div>


        <div class="field">
            <label for="maxStations">Anzahl Ergebnisse:</label>
            <input type="text" id="maxStations" placeholder="z.B. 5" min="1" step="1">
        </div>
        <button onclick="findStationsInRadius()">Suche Wetterstationen</button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <!-- Dein eigenes JavaScript  -->
    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
